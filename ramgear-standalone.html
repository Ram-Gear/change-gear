<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAM-GEAR - Gear Hobbing Machine Programs</title>
<style>
:root { --bg:#f4f5f7; --card:#fff; --ink:#1d2329; --muted:#5d6873; --line:#d6dbe0; --accent:#9b1c1c; --accent2:#24527a; --ok:#1e7b34; --warn:#a05a00; --bad:#b00020; }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:var(--ink); background:var(--bg); }
.topbar { background:#22272e; color:#fff; padding:10px 18px; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
.brand { font-weight:800; letter-spacing:.06em; font-size:20px; }
.brand span { font-weight:400; letter-spacing:0; font-size:15px; opacity:.85; margin-left:8px; }
.topnote { opacity:.7; font-size:13px; }
.layout { display:flex; min-height:calc(100vh - 48px); }
.nav { width:270px; flex:none; background:#fff; border-right:1px solid var(--line); padding:10px 0; }
.nav h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:14px 16px 4px; }
.nav a { display:block; padding:6px 16px; color:var(--ink); text-decoration:none; border-left:3px solid transparent; }
.nav a:hover { background:#f0f2f4; }
.nav a.active { border-left-color:var(--accent); background:#fbeeee; font-weight:600; }
.nav .num { display:inline-block; width:26px; color:var(--muted); font-variant-numeric:tabular-nums; }
.main { flex:1; padding:18px 22px 60px; max-width:1200px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:16px; }
.card h2 { margin:0 0 6px; font-size:20px; }
.card h3 { margin:0 0 8px; font-size:16px; }
.muted { color:var(--muted); }
.small { font-size:12.5px; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.grid-form { display:grid; grid-template-columns: minmax(220px, 340px) minmax(160px, 260px) 1fr; gap:6px 12px; align-items:center; }
.grid-form label { font-weight:600; }
.grid-form .hint { font-size:12px; color:var(--muted); }
input[type=text], input[type=number], select, textarea { font:inherit; padding:6px 8px; border:1px solid #b9c1c9; border-radius:5px; background:#fff; width:100%; }
textarea { font-family: ui-monospace, Consolas, monospace; font-size:13px; }
input:focus, select:focus, textarea:focus { outline:2px solid #8fb4d9; border-color:#5a8ac0; }
button { font:inherit; padding:7px 14px; border-radius:5px; border:1px solid #9aa5b1; background:#fff; cursor:pointer; }
button:hover { background:#f0f2f4; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
button.primary:hover { background:#7f1515; }
button.blue { background:var(--accent2); border-color:var(--accent2); color:#fff; }
button:disabled { opacity:.5; cursor:not-allowed; }
table { border-collapse:collapse; width:100%; }
th, td { border-bottom:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top; }
th { font-size:12.5px; color:var(--muted); font-weight:600; background:#fafbfc; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
tr.sel td { background:#e5f0fa; }
tr.whole td { background:#eef8ee; }
tr.clickable { cursor:pointer; }
tr.clickable:hover td { background:#f3f6f9; }
pre.screen { background:#0f1a12; color:#9cff9c; padding:10px 12px; border-radius:6px; overflow:auto; font:13px/1.35 ui-monospace, Consolas, "Courier New", monospace; margin:6px 0 0; white-space:pre; }
.results-table td:first-child { width:55%; }
.big { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
.msg { padding:8px 12px; border-radius:6px; margin:6px 0; }
.msg.err { background:#fde8ea; color:var(--bad); border:1px solid #f3b8bf; }
.msg.warn { background:#fff4e0; color:var(--warn); border:1px solid #f0d199; }
.msg.ok { background:#e8f6ec; color:var(--ok); border:1px solid #b7e0c2; }
.badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; background:#e9edf1; color:#3b4652; margin-left:6px; vertical-align:middle; }
.badge.builtin { background:#f6e3e3; color:var(--accent); }
.tbl-edit td { padding:3px 4px; }
.tbl-edit input, .tbl-edit select { padding:4px 6px; font-size:13.5px; }
.tbl-edit .name { width:110px; }
.tbl-edit .x { width:34px; padding:3px; }
details summary { cursor:pointer; color:var(--accent2); }
.flex2 { display:flex; gap:16px; flex-wrap:wrap; }
.flex2 > * { flex:1 1 380px; min-width:0; }
.scroll { max-height:420px; overflow:auto; border:1px solid var(--line); border-radius:6px; }
code { background:#eef1f4; padding:1px 4px; border-radius:3px; }
.print-area { display:none; }
@media print {
  body { background:#fff; }
  .topbar, .nav, .main { display:none !important; }
  .print-area { display:block !important; font:12pt/1.35 "Courier New", monospace; white-space:pre; }
}
@media (max-width: 820px) {
  .layout { flex-direction:column; }
  .nav { width:auto; border-right:none; border-bottom:1px solid var(--line); }
  .grid-form { grid-template-columns: 1fr; }
}
.tbl-edit { table-layout:auto; }
.tbl-edit input[type=text] { min-width:80px; }
.tbl-edit td:nth-child(2) input[type=text] { min-width:150px; }
.editor-main .grid-form { grid-template-columns: 140px minmax(200px, 1fr) minmax(120px, 220px); }

/* placeholders must not look like typed values */
input::placeholder { color: #b0b0b0; font-style: italic; }
input.invalid { border-color: #c0392b !important; background: #fff1f0; box-shadow: 0 0 0 2px rgba(192,57,43,.25); }

.version-stamp { margin-left: 12px; font-size: 11px; font-weight: normal; opacity: .75; }
.msg.info { background:#e8f0fb; color:#1d3d6b; border:1px solid #b9cdeb; }
.simple-sec h3 { margin-top:0; }
code.formula-show { font-family:ui-monospace,Consolas,monospace; background:#f3f4f6; padding:4px 6px; border-radius:4px; align-self:center; }
details.advanced > summary { cursor:pointer; font-weight:600; padding:10px 4px; }

</style>
</head>
